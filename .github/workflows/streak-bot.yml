name: Update Cybersecurity Essentials Progress

on:
  schedule:
    # Runs once a day at 21:00 UTC (~midnight EAT) to refresh the badge/table.
    - cron: "0 21 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tracker updater
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/update_streak.js

      - name: Commit changes
        run: |
          git config user.name "streak-bot"
          git config user.email "streak-bot@users.noreply.github.com"
          git add README.md data/state.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "chore: auto-update cybersecurity track progress"
          git push
